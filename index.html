<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOHO TV - WebTV Player</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* Container do Player de Vídeo em destaque */
        .video-wrapper {
            width: 100%;
            max-width: 950px;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .video-wrapper iframe {
            width: 100%; height: 100%; border: none;
        }

        /* Painel de Controle SOHO TV */
        .soho-dashboard {
            width: 100%;
            max-width: 950px;
            background: #1e1e1e;
            padding: 20px;
            border-top: 4px solid #d32f2f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-track { flex-grow: 1; }
        .artist { color: #aaa; font-size: 14px; text-transform: uppercase; font-weight: bold; }
        .title { color: #fff; font-size: 28px; font-weight: 900; text-transform: uppercase; }
        
        .status-badge {
            background: #d32f2f;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Janela de vídeo grande, limpa e no tamanho ideal -->
    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/7wjk-c8pd-vzyc-gh4t-acy8?autoplay=1&mute=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- Painel de metadados do SOHO TV -->
    <div class="soho-dashboard">
        <div class="info-track">
            <div id="soho-artist" class="artist">CARREGANDO...</div>
            <div id="soho-title" class="title">AGUARDANDO DADOS...</div>
        </div>
        <div class="status-badge">AO VIVO</div>
    </div>

    <script>
        const xmlNow = 'https://soho.ct.ws/NowOnAir.xml';

        async function updateDashboard() {
            const ts = new Date().getTime();
            try {
                const response = await fetch(`${xmlNow}?t=${ts}`);
                const data = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, "text/xml");
                
                const songNode = xmlDoc.querySelector('Event[status="happening"] Song') || xmlDoc.querySelector('Song');
                if (songNode) {
                    const title = songNode.getAttribute('title') || "---";
                    const artist = songNode.getElementsByTagName('Artist')[0]?.getAttribute('name') || "---";
                    
                    document.getElementById('soho-title').textContent = title;
                    document.getElementById('soho-artist').textContent = artist;
                }
            } catch (e) {
                console.log("Aguardando sincronização com Jazler...");
            }
        }
        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
