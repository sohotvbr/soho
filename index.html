<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOHO Pro WebTV Player</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #d32f2f;
            --accent-green: #39ff14;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .dashboard {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            max-width: 950px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .soho-player-wrapper {
            background-color: #1a1a1a;
            border-bottom: 2px solid #000;
        }

        .soho-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #151515;
            padding: 6px 12px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .soho-top-bar-left {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: 900;
            font-size: 16px;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .soho-top-bar-left span { color: var(--accent-red); font-weight: normal; font-size: 12px; margin-left: 2px;}
        
        .soho-top-bar-right { 
            display: flex; 
            gap: 6px; 
            align-items: center;
        }
        
        .soho-btn { 
            background: linear-gradient(to bottom, #444, #222);
            color: #ccc; border: 1px solid #111; 
            font-size: 10px; padding: 5px 10px; font-weight: bold; 
            border-radius: 2px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .status-live { 
            background: linear-gradient(to bottom, #008000, #004d00); 
            color: #fff; border-color: #003300;
            animation: pulse-auto 3s infinite ease-in-out; 
        }
        @keyframes pulse-auto {
            0% { opacity: 1; filter: brightness(1); }
            50% { opacity: 0.7; filter: brightness(0.7); }
            100% { opacity: 1; filter: brightness(1); }
        }

        .soho-player-body {
            display: flex;
            flex-direction: row;
            background: linear-gradient(to bottom, #2a2a2a, #111);
            min-height: 130px;
        }

        @media (max-width: 768px) {
            .soho-player-body {
                flex-direction: column;
            }
            .soho-right-side {
                width: 100% !important;
                border-left: none !important;
                border-top: 1px solid #111;
                justify-content: space-around;
            }
            .soho-huge-time {
                font-size: 35px !important;
            }
        }

        .soho-now-badge {
            width: 35px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 2px;
            animation: pulse-now 3s infinite ease-in-out;
            color: white;
            border-left: 1px solid #111; 
            flex-shrink: 0;
        }
        @keyframes pulse-now {
            0% { background-color: var(--accent-red); }
            50% { background-color: #520808; }
            100% { background-color: var(--accent-red); }
        }

        .soho-main-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            overflow: hidden;
            border-right: 1px solid #111;
            position: relative;
        }

        .soho-track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-grow: 1;
        }

        .soho-track-icon-text {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            width: 100%;
        }

        .video-container {
            width: 110px;
            height: 68px;
            background-color: #0b0b0b;
            border: 2px solid #444;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .video-container iframe {
            width: 300%;
            height: 300%;
            position: absolute;
            top: -100%;
            left: -100%;
            border: none;
            pointer-events: auto;
        }

        .soho-track-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .title-wrapper { 
            width: 100%; 
            overflow: hidden; 
            white-space: nowrap; 
        }

        .soho-artist { 
            font-size: 13px; 
            color: #aaa; 
            text-transform: uppercase; 
            font-weight: bold;
        }

        .soho-title { 
            font-size: 18px; 
            font-weight: 900; 
            color: #fff; 
            text-transform: uppercase; 
            text-shadow: 1px 1px 2px #000;
        }

        .soho-meta { font-size: 10px; color: #888; }

        .soho-huge-time {
            font-size: 45px;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--accent-green);
            font-weight: normal;
            line-height: 0.9;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .soho-waveform {
            height: 6px;
            background-color: #080808;
            position: relative;
            border: 1px solid #111;
            margin-top: 5px;
        }
        .soho-waveform-progress {
            background-color: var(--accent-green); 
            width: 100%;
            height: 100%;
        }

        .soho-right-side {
            display: flex;
            background-color: #1a1a1a;
            flex-shrink: 0;
        }

        .soho-clock-area {
            width: 105px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #151515;
            border-right: 1px solid #111;
        }
        .soho-clock-circle {
            width: 85px; height: 85px;
            border-radius: 50%;
            border: 2px dashed #0055ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            background-color: #0a0a0a;
        }
        .soho-clock-day { font-size: 9px; color: #aaa; }
        .soho-clock-time { font-size: 16px; font-weight: bold; line-height: 1; }
        .soho-clock-date { font-size: 9px; color: #aaa; }

        .soho-buttons-area { display: flex; }
        .soho-action-btn {
            width: 40px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 4px;
            border-right: 1px solid #111;
            color: #888; font-size: 8px;
            cursor: pointer;
            background: linear-gradient(to bottom, #252525, #111);
        }
        .soho-action-btn svg { width: 20px; height: 20px; fill: #ddd; margin-bottom: 15px;}

        .track-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: #252525;
            overflow: hidden;
        }
        .badge {
            color: white; writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
            padding: 10px 6px; font-weight: 900; font-size: 12px; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; width: 20px; flex-shrink: 0;
        }
        .badge.next { background-color: #7a1515; }
        .info-area { padding: 10px 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .title { display: inline-block; font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .title.next-title-style { font-size: 14px; color: #ddd; }
        .artist { font-size: 12px; color: var(--text-muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .history-section { padding: 15px; background-color: var(--panel-bg); }
        .history-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .history-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
        .history-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px dashed #333; font-size: 12px; }
    </style>
</head>
<body>

    <div class="dashboard">

        <div class="soho-player-wrapper">
            <div class="soho-top-bar">
                <div class="soho-top-bar-left">SOHO<span>TV</span></div>
                <div class="soho-top-bar-right">
                    <button class="soho-btn status-live">LIVE</button>
                </div>
            </div>

            <div class="soho-player-body">
                <div class="soho-now-badge">LIVE</div>

                <div class="soho-main-display">
                    <div class="soho-track-header">
                        <div class="soho-track-icon-text">
                            <!-- Player real do YouTube embutido com suporte a live stream -->
                            <div class="video-container">
                                <iframe src="https://www.youtube.com/embed/7wjk-c8pd-vzyc-gh4t-acy8?autoplay=1&mute=0&controls=0&playsinline=1" allow="autoplay; encrypted-media"></iframe>
                            </div>
                            
                            <div class="soho-track-text">
                                <div class="title-wrapper">
                                    <span id="soho-artist" class="soho-artist">AGUARDANDO DADOS...</span>
                                </div>
                                <div class="title-wrapper">
                                    <span id="soho-title" class="soho-title">CARREGANDO MÚSICA...</span>
                                </div>
                                <span id="soho-meta" class="soho-meta">YouTube Live Stream</span>
                            </div>
                        </div>
                        <div id="soho-time" class="soho-huge-time">00:00</div>
                    </div>

                    <div class="soho-waveform" id="waveform-container">
                        <div class="soho-waveform-progress"></div>
                    </div>
                </div>

                <div class="soho-right-side">
                    <div class="soho-clock-area">
                        <div class="soho-clock-circle">
                            <span id="clock-day" class="soho-clock-day">dia</span>
                            <span id="clock-time" class="soho-clock-time">00:00:00</span>
                            <span id="clock-date" class="soho-clock-date">Data</span>
                        </div>
                    </div>

                    <div class="soho-buttons-area">
                        <div class="soho-action-btn">
                            <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
                            Restart
                        </div>
                        <div class="soho-action-btn">
                            <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                            Loop
                        </div>
                        <div class="soho-action-btn">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                            StopNext
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="track-row">
            <div class="badge next">NEXT</div>
            <div class="info-area">
                <div class="title-wrapper">
                    <div id="next-title" class="title next-title-style">Aguardando próximo clipe...</div>
                </div>
                <div id="next-artist" class="artist">---</div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">Últimos Clipes Tocados</div>
            <ul id="history-list" class="history-list">
                <li class="history-item">Painel SOHO TV conectado ao YouTube.</li>
            </ul>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const days = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
            document.getElementById('clock-day').textContent = days[now.getDay()];
            document.getElementById('clock-time').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('clock-date').textContent = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ATENÇÃO: Altere abaixo para o link onde o Jazler joga os XMLs (ex: sua hospedagem anterior)
        const xmlNow = 'https://soho.ct.ws/NowOnAir.xml';
        const xmlNext = 'https://soho.ct.ws/AirPlayNext.xml';
        const xmlHistory = 'https://soho.ct.ws/AirPlayHistory.xml';

        async function updateDashboard() {
            const ts = new Date().getTime();
            try {
                const [resNow, resNext, resHistory] = await Promise.all([
                    fetch(`${xmlNow}?t=${ts}`).catch(() => null),
                    fetch(`${xmlNext}?t=${ts}`).catch(() => null),
                    fetch(`${xmlHistory}?t=${ts}`).catch(() => null)
                ]);
                const parser = new DOMParser();

                if (resNow && resNow.ok) {
                    const xmlDoc = parser.parseFromString(await resNow.text(), "text/xml");
                    const songNode = xmlDoc.querySelector('Event[status="happening"] Song') || xmlDoc.querySelector('Song');
                    if (songNode) {
                        const xmlTitle = songNode.getAttribute('title') || "---";
                        const artistNode = songNode.getElementsByTagName('Artist')[0];
                        const artistName = artistNode ? artistNode.getAttribute('name') : "---";
                        document.getElementById('soho-title').textContent = xmlTitle;
                        document.getElementById('soho-artist').textContent = artistName;
                    }
                }

                if (resNext && resNext.ok) {
                    const xmlDocNext = parser.parseFromString(await resNext.text(), "text/xml");
                    const nextSong = xmlDocNext.querySelector('Song');
                    if (nextSong) {
                        const nextTitle = nextSong.getAttribute('title') || "---";
                        const nextArtistNode = nextSong.getElementsByTagName('Artist')[0];
                        const nextArtist = nextArtistNode ? nextArtistNode.getAttribute('name') : "---";
                        document.getElementById('next-title').textContent = nextTitle;
                        document.getElementById('next-artist').textContent = nextArtist;
                    }
                }

                if (resHistory && resHistory.ok) {
                    const xmlDocHist = parser.parseFromString(await resHistory.text(), "text/xml");
                    const songs = xmlDocHist.querySelectorAll('Song');
                    const historyList = document.getElementById('history-list');
                    if (songs.length > 0) {
                        let html = '';
                        let count = 0;
                        for (let i = songs.length - 1; i >= 0 && count < 10; i--) {
                            let s = songs[i];
                            let t = s.getAttribute('title') || "---";
                            let arNode = s.getElementsByTagName('Artist')[0];
                            let ar = arNode ? arNode.getAttribute('name') : "";
                            let timeStr = s.getAttribute('time') || "";
                            html += `<li class="history-item"><span class="hist-time">${timeStr}</span><strong class="hist-title">${t}</strong> <span class="hist-artist"> - ${ar}</span></li>`;
                            count++;
                        }
                        historyList.innerHTML = html;
                    }
                }
            } catch (e) {}
        }
        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
