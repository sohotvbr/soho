<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOHO TV - WebTV Player</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* Container principal da WebTV */
        .video-wrapper {
            width: 100%;
            max-width: 950px;
            aspect-ratio: 16 / 9;
            background: #111;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 2px solid #222;
        }

        /* Tela de Preview / Fallback elegante se o embed falhar */
        .tv-fallback {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a1a, #050505);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        .tv-fallback h2 { color: #fff; font-size: 24px; margin: 0 0 10px 0; letter-spacing: 1px; }
        .tv-fallback p { color: #888; font-size: 14px; margin: 0 0 20px 0; }
        
        .watch-btn {
            background-color: #d32f2f;
            color: #fff;
            padding: 12px 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
            transition: background 0.2s;
        }
        .watch-btn:hover { background-color: #ff3b3b; }

        /* Painel de Controle SOHO TV */
        .soho-dashboard {
            width: 100%;
            max-width: 950px;
            background: #1e1e1e;
            padding: 20px;
            border-top: 4px solid #d32f2f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .info-track { flex-grow: 1; overflow: hidden; }
        .artist { color: #aaa; font-size: 14px; text-transform: uppercase; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .title { color: #fff; font-size: 26px; font-weight: 900; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .status-badge {
            background: #d32f2f;
            color: #fff;
            padding: 6px 15px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
            margin-left: 15px;
        }
    </style>
</head>
<body>

    <!-- Visor da WebTV com tela de conexão limpa para evitar bloqueio de ID do YouTube -->
    <div class="video-wrapper">
        <div class="tv-fallback">
            <h2>SOHO TV AO VIVO</h2>
            <p>Transmissão oficial sincronizada com o encoder</p>
            <a href="https://www.youtube.com/watch?v=7wjk-c8pd-vzyc-gh4t-acy8" target="_blank" class="watch-btn">Assistir Transmissão Completa</a>
        </div>
    </div>

    <!-- Painel de metadados do SOHO TV -->
    <div class="soho-dashboard">
        <div class="info-track">
            <div id="soho-artist" class="artist">AGUARDANDO SINAL...</div>
            <div id="soho-title" class="title">SOHO TV NO AR</div>
        </div>
        <div class="status-badge">AO VIVO</div>
    </div>

    <script>
        const xmlNow = 'https://soho.ct.ws/NowOnAir.xml';

        async function updateDashboard() {
            const ts = new Date().getTime();
            try {
                const response = await fetch(`${xmlNow}?t=${ts}`);
                const data = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, "text/xml");
                
                const songNode = xmlDoc.querySelector('Event[status="happening"] Song') || xmlDoc.querySelector('Song');
                if (songNode) {
                    const title = songNode.getAttribute('title') || "---";
                    const artist = songNode.getElementsByTagName('Artist')[0]?.getAttribute('name') || "---";
                    
                    document.getElementById('soho-title').textContent = title;
                    document.getElementById('soho-artist').textContent = artist;
                }
            } catch (e) {
                console.log("Aguardando sincronização com Jazler...");
            }
        }
        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
