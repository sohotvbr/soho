<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOHO TV - WebTV Player</title>
    <style>
        :root {
            --bg-dark: #000000;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-red: #d32f2f;
            --accent-green: #39ff14;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }
        .video-wrapper iframe {
            width: 100%; height: 100%; border: none;
        }

        .dashboard {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .soho-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #151515;
            padding: 8px 15px;
            border-bottom: 1px solid #333;
        }
        .soho-logo { font-weight: 900; font-size: 16px; color: #fff; }
        .soho-logo span { color: var(--accent-red); font-size: 12px; font-weight: normal; }
        
        .status-live {
            background: linear-gradient(to bottom, #008000, #004d00);
            color: #fff; padding: 4px 12px; font-size: 11px; font-weight: bold; border-radius: 2px;
        }

        .soho-player-body {
            display: flex;
            background: linear-gradient(to bottom, #2a2a2a, #111);
            padding: 15px;
            gap: 20px;
            align-items: center;
        }

        .info-track { flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 5px; }
        .artist { color: #aaa; font-size: 14px; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
        .title { color: #fff; font-size: 24px; font-weight: 900; text-transform: uppercase; text-shadow: 1px 1px 2px #000; }

        /* Waveform e Relógio */
        .waveform-time-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .soho-waveform {
            height: 35px;
            background-color: #080808;
            position: relative;
            border: 1px solid #111;
            flex-grow: 1;
            overflow: hidden;
            border-radius: 2px;
        }
        .soho-waveform-progress {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            background-color: rgba(211, 47, 47, 0.4); /* Barra vermelha deslizante */
            width: 0%;
            z-index: 1;
            transition: width 1s linear;
        }
        #waveform-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
        }

        .soho-huge-time {
            font-size: 38px;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--accent-green);
            font-weight: normal;
            line-height: 1;
            flex-shrink: 0;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        /* VU-Meters Horizontais */
        .vu-horizontal-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 150px;
            background: #151515;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .vu-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #aaa;
            font-weight: bold;
        }
        .vu-bar-bg {
            flex-grow: 1;
            height: 8px;
            background: #080808;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }
        .vu-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #008000 50%, #ffff00 80%, #ff0000 100%);
            transition: width 0.1s ease;
        }

        .track-row {
            display: flex;
            border-top: 1px solid var(--border-color);
            background-color: #252525;
            overflow: hidden;
        }
        .badge {
            color: white; writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
            padding: 10px 6px; font-weight: 900; font-size: 11px; letter-spacing: 2px;
            background-color: #7a1515; display: flex; align-items: center; justify-content: center; width: 20px;
        }
        .next-info { padding: 10px 15px; flex-grow: 1; }
        .next-title { font-size: 14px; font-weight: bold; color: #ddd; text-transform: uppercase; }
        .next-artist { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        .history-section { padding: 12px 15px; background-color: var(--panel-bg); }
        .history-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 3px; }
        .history-list { list-style: none; padding: 0; margin: 0; max-height: 120px; overflow-y: auto; }
        .history-item { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px dashed #333; font-size: 11px; color: #ccc; }
        .hist-time { color: var(--accent-green); margin-right: 8px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Player de Vídeo -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/F_QXRKpSAfg?autoplay=1&mute=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <!-- Painel de Controle SOHO TV -->
        <div class="dashboard">
            <div class="soho-top-bar">
                <div class="soho-logo">SOHO<span>TV</span></div>
                <div class="status-live">AO VIVO</div>
            </div>

            <div class="soho-player-body">
                <div class="info-track">
                    <div id="soho-artist" class="artist">CONECTANDO...</div>
                    <div id="soho-title" class="title">AGUARDANDO DADOS...</div>
                    
                    <div class="waveform-time-container">
                        <div class="soho-waveform" id="waveform-container">
                            <div id="soho-progress" class="soho-waveform-progress"></div>
                            <canvas id="waveform-canvas"></canvas>
                        </div>
                        <div id="soho-time" class="soho-huge-time">00:00</div>
                    </div>
                </div>

                <!-- VU-Meters Horizontais -->
                <div class="vu-horizontal-area">
                    <div class="vu-row">
                        <span>L</span>
                        <div class="vu-bar-bg"><div id="vu-fill-l" class="vu-bar-fill"></div></div>
                    </div>
                    <div class="vu-row">
                        <span>R</span>
                        <div class="vu-bar-bg"><div id="vu-fill-r" class="vu-bar-fill"></div></div>
                    </div>
                </div>
            </div>

            <!-- Bloco NEXT -->
            <div class="track-row">
                <div class="badge">NEXT</div>
                <div class="next-info">
                    <div id="next-title" class="next-title">Aguardando próximo clipe...</div>
                    <div id="next-artist" class="next-artist">---</div>
                </div>
            </div>

            <!-- Histórico -->
            <div class="history-section">
                <div class="history-title">Últimos Clipes Tocados</div>
                <ul id="history-list" class="history-list">
                    <li class="history-item">Painel SOHO TV inicializado.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Animações dinâmicas do Waveform e VU (já que o YT não permite leitura de áudio real)
        const canvas = document.getElementById('waveform-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('waveform-container');

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateVisualizers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2.0;
            ctx.strokeStyle = '#39ff14';
            ctx.beginPath();
            let time = Date.now() / 150;
            for(let x = 0; x < canvas.width; x += 3) {
                let y = (canvas.height / 2) + Math.sin(x * 0.05 + time) * (Math.sin(x * 0.01) * 10 + 2);
                if(x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            let randL = Math.random() * 50 + 30;
            let randR = Math.random() * 50 + 30;
            document.getElementById('vu-fill-l').style.width = randL + '%';
            document.getElementById('vu-fill-r').style.width = randR + '%';

            requestAnimationFrame(animateVisualizers);
        }
        requestAnimationFrame(animateVisualizers);

        // Lógica REAIS de Temporizador e Progresso baseados no Jazler
        let currentSongTitle = "";
        let trackDurationSeconds = 0;
        let trackStartTimestamp = 0;

        function updateTimer() {
            if (trackDurationSeconds === 0) return;
            
            let elapsedSeconds = Math.floor((Date.now() - trackStartTimestamp) / 1000);
            
            // Trava o tempo se passar do tamanho da música
            if (elapsedSeconds < 0) elapsedSeconds = 0;
            if (elapsedSeconds > trackDurationSeconds) elapsedSeconds = trackDurationSeconds;

            let m = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
            let s = (elapsedSeconds % 60).toString().padStart(2, '0');
            
            document.getElementById('soho-time').textContent = `${m}:${s}`;
            document.getElementById('soho-progress').style.width = `${(elapsedSeconds / trackDurationSeconds) * 100}%`;
        }
        // Atualiza o relógio todo segundo
        setInterval(updateTimer, 1000);


        // Alvará de soltura: corsproxy.io
        const proxy = 'https://corsproxy.io/?';
        const urlNow = 'http://soho.ct.ws/NowOnAir.xml';
        const urlNext = 'http://soho.ct.ws/AirPlayNext.xml';
        const urlHistory = 'http://soho.ct.ws/AirPlayHistory.xml';

        async function updateDashboard() {
            const ts = new Date().getTime();
            try {
                const fetchNow = fetch(proxy + encodeURIComponent(`${urlNow}?t=${ts}`)).catch(() => null);
                const fetchNext = fetch(proxy + encodeURIComponent(`${urlNext}?t=${ts}`)).catch(() => null);
                const fetchHistory = fetch(proxy + encodeURIComponent(`${urlHistory}?t=${ts}`)).catch(() => null);

                const [resNow, resNext, resHistory] = await Promise.all([fetchNow, fetchNext, fetchHistory]);
                const parser = new DOMParser();

                // Lendo a Música Atual
                if (resNow && resNow.ok) {
                    const xmlDoc = parser.parseFromString(await resNow.text(), "text/xml");
                    const songNode = xmlDoc.querySelector('Event[status="happening"] Song');
                    if (songNode) {
                        let newTitle = songNode.getAttribute('title') || "---";
                        document.getElementById('soho-title').textContent = newTitle;
                        document.getElementById('soho-artist').textContent = songNode.querySelector('Artist')?.getAttribute('name') || "---";
                        
                        // Detecção de música nova para resetar o contador!
                        if (newTitle !== currentSongTitle) {
                            currentSongTitle = newTitle;
                            trackStartTimestamp = Date.now(); // Inicia o contador agora
                            
                            // Tenta ler o tempo total do XML (ex: runTime="03:24")
                            let mediaNode = songNode.querySelector('Media');
                            if (mediaNode) {
                                let runTime = mediaNode.getAttribute('runTime'); // formato "MM:SS"
                                if (runTime) {
                                    let timeParts = runTime.split(':');
                                    if (timeParts.length === 2) {
                                        trackDurationSeconds = (parseInt(timeParts[0]) * 60) + parseInt(timeParts[1]);
                                    }
                                }
                            }
                        }
                    }
                }

                // Lendo a Próxima Música
                if (resNext && resNext.ok) {
                    const xmlDocNext = parser.parseFromString(await resNext.text(), "text/xml");
                    const nextSong = xmlDocNext.querySelector('Song');
                    if (nextSong) {
                        document.getElementById('next-title').textContent = nextSong.getAttribute('title') || "---";
                        document.getElementById('next-artist').textContent = nextSong.querySelector('Artist')?.getAttribute('name') || "---";
                    }
                }

                // Lendo o Histórico
                if (resHistory && resHistory.ok) {
                    const xmlDocHist = parser.parseFromString(await resHistory.text(), "text/xml");
                    const songs = xmlDocHist.querySelectorAll('Song');
                    const historyList = document.getElementById('history-list');
                    if (songs.length > 0) {
                        let html = '';
                        let count = 0;
                        for (let i = songs.length - 1; i >= 0 && count < 8; i--) {
                            let s = songs[i];
                            let t = s.getAttribute('title') || "---";
                            let ar = s.querySelector('Artist')?.getAttribute('name') || "";
                            let timeStr = s.querySelector('Info')?.getAttribute('StartTime') || "";
                            html += `<li class="history-item"><span class="hist-time">${timeStr}</span><strong>${t}</strong> &nbsp;-&nbsp; ${ar}</li>`;
                            count++;
                        }
                        historyList.innerHTML = html;
                    }
                }
            } catch (e) { }
        }
        
        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
